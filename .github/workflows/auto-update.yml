name: Refresh Live Source
on:
  push:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run refresh script
        run: node refresh.js
      
      # 下面这段就是推送到Gitee新增代码
      - name: Push to Gitee
        run: |
          git config --global user.name "mhg444103496"
          git config --global user.email "mhg444103496@qq.com"
          git remote add gitee https://qqyywb:${{ secrets.GITEE_TOKEN }}@gitee.com/qqyywb/migu-tv.git
          git push gitee main --force
