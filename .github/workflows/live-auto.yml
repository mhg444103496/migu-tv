name: Refresh Live Source
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run refresh script
        run: node refresh.js

      - name: Commit & Push changes
        run: |
          git config --global user.name "mhg444103496"
          git config --global user.email "mhg444103496@users.noreply.github.com"
          git add live.txt
          git commit -m "Auto update live.txt" || echo "No changes to commit"
          git push
